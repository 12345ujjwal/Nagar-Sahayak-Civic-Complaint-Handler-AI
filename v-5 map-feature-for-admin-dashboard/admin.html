<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagar Sahayak — Team Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #EEF3F5;
    --surface: #FFFFFF;
    --surface-2: #F5F8FA;
    --line: #D9E4E8;
    --green: #E8735A;
    --green-dim: rgba(232, 115, 90, 0.14);
    --amber: #5B9BD5;
    --amber-dim: rgba(91, 155, 213, 0.14);
    --danger: #D64545;
    --danger-dim: rgba(214, 69, 69, 0.14);
    --text: #33403D;
    --muted: #6B7A78;
    --muted-2: #97A6A3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Nunito', -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 0%, #F8FBFC 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px;
  }

  .mono { font-family: 'Space Mono', monospace; }

  .wrap { max-width: 1000px; margin: 0 auto; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .top-left { display: flex; align-items: center; gap: 12px; }

  .mark {
    width: 42px; height: 42px; border-radius: 11px;
    background: linear-gradient(135deg, var(--green) 0%, #C85A42 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; box-shadow: 0 4px 14px rgba(232, 115, 90, 0.35);
  }

  .top h1 { font-size: 17px; margin: 0; font-weight: 800; }
  .top .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }

  .stat-box {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 16px; min-width: 90px; text-align: center;
  }
  .stat-box .n { font-size: 20px; font-weight: 800; font-family: 'Space Mono', monospace; }
  .stat-box .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted-2); font-weight: 700; margin-top: 2px; }
  .stat-box.green .n { color: var(--green); }
  .stat-box.amber .n { color: var(--amber); }
  .stat-box.muted .n { color: var(--muted); }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  .filter-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 20px; cursor: pointer;
  }
  .filter-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .refresh-btn {
    margin-left: auto;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 20px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--green); }

  .list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
  }
  .card.status-submitted::before { background: var(--amber); }
  .card.status-acknowledged::before { background: #5B9BD5; }
  .card.status-resolved::before { background: var(--green); }

  .card-top {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }

  .ticket-id { font-weight: 700; color: var(--green); font-size: 15px; }

  .status-pill {
    display: inline-block; padding: 3px 11px; border-radius: 20px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .status-pill.submitted { background: var(--amber-dim); color: var(--amber); }
  .status-pill.acknowledged { background: rgba(91,155,213,0.14); color: #5B9BD5; }
  .status-pill.resolved { background: var(--green-dim); color: var(--green); }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px; margin-bottom: 10px;
  }
  .field-box { background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
  .field-box .k { font-size: 8.5px; text-transform: uppercase; color: var(--muted-2); font-weight: 700; }
  .field-box .v { font-size: 12px; color: var(--text); font-weight: 600; }

  .complaint-preview {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    border-top: 1px dashed var(--line); padding-top: 8px; margin-bottom: 12px;
  }

  .photo-strip { display: flex; gap: 6px; margin-bottom: 12px; }
  .photo-strip img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .action-btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    font-size: 11.5px; font-weight: 700; padding: 7px 13px; border-radius: 9px; cursor: pointer;
  }
  .action-btn.ack:hover { border-color: #5B9BD5; color: #5B9BD5; }
  .action-btn.resolve:hover { border-color: var(--green); color: var(--green); }
  .action-btn:disabled { opacity: 0.35; cursor: default; }

  .empty { text-align: center; color: var(--muted-2); padding: 60px 20px; font-size: 13px; }

  .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

  .view-toggle { display: flex; gap: 6px; }
  .view-toggle button {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 20px; cursor: pointer;
  }
  .view-toggle button.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  #mapView { display: none; }
  #mapView.active { display: block; }
  #mapContainer {
    width: 100%; height: 480px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); background: var(--surface);
  }
  .map-note {
    font-size: 11.5px; color: var(--muted-2); margin-top: 8px; text-align: center;
  }

  .leaflet-popup-content-wrapper {
    background: var(--surface); color: var(--text); border-radius: 10px;
    font-family: 'Nunito', sans-serif;
  }
  .leaflet-popup-tip { background: var(--surface); }
  .popup-ticket { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--green); font-size: 13px; margin-bottom: 4px; }
  .popup-row { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .popup-row b { color: var(--text); }
  .popup-status {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px;
    font-weight: 700; margin-top: 4px; text-transform: uppercase;
  }
  .popup-status.submitted { background: var(--amber-dim); color: var(--amber); }
  .popup-status.acknowledged { background: rgba(91,155,213,0.14); color: #5B9BD5; }
  .popup-status.resolved { background: var(--green-dim); color: var(--green); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="top-left">
      <div class="mark">🏛️</div>
      <div>
        <h1>NAGAR SAHAYAK — ADMIN CONSOLE</h1>
        <div class="sub">Manage incoming civic complaints</div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Submitted">Submitted</button>
    <button class="filter-btn" data-filter="Acknowledged">Acknowledged</button>
    <button class="filter-btn" data-filter="Resolved">Resolved</button>
    <div class="view-toggle" style="margin-left:auto;">
      <button class="active" id="listViewBtn">☰ List</button>
      <button id="mapViewBtn">🗺️ Map</button>
    </div>
    <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  </div>

  <div class="list" id="list">
    <div class="loading">Loading complaints…</div>
  </div>

  <div id="mapView">
    <div id="mapContainer"></div>
    <div class="map-note" id="mapNote"></div>
  </div>
</div>

<script>
  const API_BASE = "https://idx9aw95o7.execute-api.ap-south-1.amazonaws.com";

  let allComplaints = [];
  let currentFilter = "All";

  async function loadComplaints() {
    document.getElementById("list").innerHTML = `<div class="loading">Loading complaints…</div>`;
    try {
      const res = await fetch(`${API_BASE}/admin/complaints`);
      allComplaints = await res.json();
      renderStats();
      renderList();
      if (currentView === "map") renderMap();
    } catch (err) {
      document.getElementById("list").innerHTML = `<div class="empty">Couldn't load complaints. Check your connection.</div>`;
    }
  }

  function renderStats() {
    const counts = { Submitted: 0, Acknowledged: 0, Resolved: 0 };
    allComplaints.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });

    document.getElementById("stats").innerHTML = `
      <div class="stat-box muted"><div class="n">${allComplaints.length}</div><div class="l">Total</div></div>
      <div class="stat-box amber"><div class="n">${counts.Submitted || 0}</div><div class="l">Submitted</div></div>
      <div class="stat-box" style="color:#5B9BD5"><div class="n" style="color:#5B9BD5">${counts.Acknowledged || 0}</div><div class="l">Acknowledged</div></div>
      <div class="stat-box green"><div class="n">${counts.Resolved || 0}</div><div class="l">Resolved</div></div>
    `;
  }

  function renderList() {
    const filtered = currentFilter === "All"
      ? allComplaints
      : allComplaints.filter(c => c.status === currentFilter);

    if (!filtered.length) {
      document.getElementById("list").innerHTML = `<div class="empty">No complaints in this view.</div>`;
      return;
    }

    document.getElementById("list").innerHTML = filtered.map(c => {
      const statusClass = c.status.toLowerCase();
      const photosHtml = (c.image_keys && c.image_keys.length)
        ? `<div class="photo-strip">${c.image_keys.map(k => `<img src="https://civic-complaint-photos-ujjwal123.s3.ap-south-1.amazonaws.com/${k}">`).join("")}</div>`
        : "";

      return `
        <div class="card status-${statusClass}">
          <div class="card-top">
            <div class="ticket-id mono">${c.ticket_id}</div>
            <span class="status-pill ${statusClass}">${c.status}</span>
          </div>
          <div class="card-grid">
            <div class="field-box"><div class="k">Issue</div><div class="v">${c.issue_type || "—"}</div></div>
            <div class="field-box"><div class="k">Department</div><div class="v">${c.department || "—"}</div></div>
            <div class="field-box"><div class="k">Location</div><div class="v">${c.location || "—"}</div></div>
            <div class="field-box"><div class="k">Date</div><div class="v">${c.incident_date || "—"}</div></div>
          </div>
          ${photosHtml}
          <div class="complaint-preview">${c.drafted_complaint || ""}</div>
          <div class="actions">
            <button class="action-btn ack" data-ticket="${c.ticket_id}" data-status="Acknowledged" ${c.status !== "Submitted" ? "disabled" : ""}>Mark Acknowledged</button>
            <button class="action-btn resolve" data-ticket="${c.ticket_id}" data-status="Resolved" ${c.status === "Resolved" ? "disabled" : ""}>Mark Resolved</button>
          </div>
        </div>
      `;
    }).join("");

    document.querySelectorAll(".action-btn").forEach(btn => {
      btn.addEventListener("click", () => updateStatus(btn.dataset.ticket, btn.dataset.status));
    });
  }

  async function updateStatus(ticketId, newStatus) {
    try {
      await fetch(`${API_BASE}/update-status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticket_id: ticketId, status: newStatus })
      });
      await loadComplaints();
    } catch (err) {
      alert("Couldn't update status — please try again.");
    }
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderList();
      if (currentView === "map") renderMap();
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", loadComplaints);

  // ---- Map view ----
  let map = null;
  let markers = [];
  let currentView = "list";

  function statusColor(status) {
    if (status === "Acknowledged") return "#5B9BD5";
    if (status === "Resolved") return "#E8735A";
    return "#F2A93B"; // Submitted / fallback amber-ish
  }

  function initMap() {
    if (map) return;
    map = L.map("mapContainer").setView([20.5937, 78.9629], 5); // India-wide default view
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
  }

  function renderMap() {
    initMap();
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const filtered = currentFilter === "All"
      ? allComplaints
      : allComplaints.filter(c => c.status === currentFilter);

    const withGeo = filtered.filter(c => c.geo && c.geo.lat && c.geo.lng);
    const withoutGeo = filtered.length - withGeo.length;

    withGeo.forEach(c => {
      const marker = L.circleMarker([c.geo.lat, c.geo.lng], {
        radius: 9,
        fillColor: statusColor(c.status),
        color: "#FFFFFF",
        weight: 2,
        fillOpacity: 0.9
      }).addTo(map);

      const statusClass = c.status.toLowerCase();
      marker.bindPopup(`
        <div class="popup-ticket">${c.ticket_id}</div>
        <div class="popup-row"><b>${c.issue_type || "—"}</b></div>
        <div class="popup-row">${c.department || "—"}</div>
        <div class="popup-row">${c.location || "—"}</div>
        <span class="popup-status ${statusClass}">${c.status}</span>
      `);
      markers.push(marker);
    });

    document.getElementById("mapNote").textContent = withoutGeo > 0
      ? `${withGeo.length} complaint(s) shown on map · ${withoutGeo} without shared location not plotted`
      : `${withGeo.length} complaint(s) shown on map`;

    if (withGeo.length) {
      const group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.2));
    }

    setTimeout(() => map.invalidateSize(), 100);
  }

  document.getElementById("listViewBtn").addEventListener("click", () => {
    currentView = "list";
    document.getElementById("listViewBtn").classList.add("active");
    document.getElementById("mapViewBtn").classList.remove("active");
    document.getElementById("list").style.display = "flex";
    document.getElementById("mapView").classList.remove("active");
  });

  document.getElementById("mapViewBtn").addEventListener("click", () => {
    currentView = "map";
    document.getElementById("mapViewBtn").classList.add("active");
    document.getElementById("listViewBtn").classList.remove("active");
    document.getElementById("list").style.display = "none";
    document.getElementById("mapView").classList.add("active");
    renderMap();
  });

  loadComplaints();
</script>

</body>
</html>
